<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEOpath Finder · Portrait map preview</title>
<style>
:root{color-scheme:dark;--bg:#0b1218;--card:#121f28;--edge:#2a3b46;--muted:#98aab5;--aqua:#5ed9d0;--green:#a2ec78}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 70% 0,#183445,transparent 47%),var(--bg);color:#edf5f7;font:15px system-ui,sans-serif}main{max-width:990px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:clamp(23px,4vw,34px);letter-spacing:-.04em}header p{margin:4px 0;color:var(--muted)}.badge{border:1px solid #3e5b68;border-radius:30px;padding:7px 11px;color:#bed1d8;font-size:12px}.layout{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(280px,1fr);gap:20px;align-items:start}.device{max-width:420px;margin:auto;padding:17px;border:1px solid #354c59;border-radius:26px;background:linear-gradient(145deg,#26343d,#101820 45%,#060a0e);box-shadow:0 25px 60px #0008}.bezel{padding:10px;border:1px solid #465862;border-radius:12px;background:#030608}.screen{display:block;width:100%;height:auto;aspect-ratio:2/3;background:#d8e2d6;image-rendering:pixelated}.caption{text-align:center;color:#8297a2;font-size:12px;margin-top:11px}.controls{display:grid;gap:12px}.card{padding:16px;border:1px solid var(--edge);border-radius:14px;background:linear-gradient(150deg,#14212a,#0e171e)}h2{font-size:15px;margin:0 0 13px}.row{display:flex;justify-content:space-between;color:#bdccd2;font-size:13px;margin:11px 0 4px}output{color:var(--aqua);font-variant-numeric:tabular-nums}input{width:100%;accent-color:var(--aqua)}.toggles{display:flex;gap:7px;flex-wrap:wrap}.toggles button{border:1px solid #3a4e59;background:#17242c;color:#a9bac3;padding:7px 10px;border-radius:20px;cursor:pointer}.toggles button.on{border-color:#587b4c;color:var(--green)}.note{color:#879ba6;font-size:12px;line-height:1.5;margin:12px 0 0}@media(max-width:700px){body{padding:15px}header{align-items:flex-start;gap:10px;flex-direction:column}.layout{grid-template-columns:1fr}.device{width:min(100%,330px)}}
</style></head><body><main>
<header><div><h1>GEOpath Finder</h1><p>Portrait offline map viewer · simulated TFT</p></div><span class="badge">320 × 480 · PORTRAIT</span></header>
<section class="layout"><div><div class="device"><div class="bezel"><canvas id="map" class="screen" width="320" height="480" aria-label="Simulated portrait map display"></canvas></div></div><div class="caption">The device screen is the tall rectangle shown here.</div></div>
<aside class="controls"><section class="card"><h2>Simulate device</h2>
<div class="row"><label for="lat">Latitude</label><output id="latv"></output></div><input id="lat" type="range" min="37.418" max="37.426" step="0.00001" value="37.4220">
<div class="row"><label for="lon">Longitude</label><output id="lonv"></output></div><input id="lon" type="range" min="-122.088" max="-122.080" step="0.00001" value="-122.0840">
<div class="row"><label for="heading">Compass heading</label><output id="headingv"></output></div><input id="heading" type="range" min="0" max="359" value="35">
<div class="row"><label for="zoom">Tile zoom</label><output id="zoomv"></output></div><input id="zoom" type="range" min="14" max="18" value="16"></section>
<section class="card"><h2>Device status <span style="color:#879ba6;font-weight:400">(click to toggle)</span></h2><div class="toggles"><button class="on" data-state="gps">GPS fix</button><button class="on" data-state="sd">SD card</button><button class="on" data-state="tiles">Map tiles</button><button class="on" data-state="imu">Compass</button></div><p class="note">The map artwork is illustrative, not real map data. Firmware displays the tiles copied to the SD card.</p></section></aside></section>
</main><script>
const c=document.querySelector('#map'),ctx=c.getContext('2d'),states={gps:true,sd:true,tiles:true,imu:true};
const latEl=document.querySelector('#lat'),lonEl=document.querySelector('#lon'),headingEl=document.querySelector('#heading');
function draw(){const w=320,h=480,lat=+latEl.value,lon=+lonEl.value,head=+headingEl.value,zoom=+document.querySelector('#zoom').value;
ctx.fillStyle='#d8e2d6';ctx.fillRect(0,0,w,h);
// Decorative, fictional map pattern to show the portrait screen layout.
ctx.fillStyle='#c7dfc7';ctx.fillRect(16,78,108,82);ctx.fillRect(198,83,105,104);ctx.fillRect(18,343,106,79);ctx.fillRect(195,348,108,75);ctx.fillRect(202,220,95,81);
ctx.fillStyle='#c9d5c8';ctx.beginPath();ctx.moveTo(0,208);ctx.lineTo(0,270);ctx.lineTo(320,350);ctx.lineTo(320,287);ctx.closePath();ctx.fill();
ctx.strokeStyle='#b7d6e1';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(5,170);ctx.bezierCurveTo(95,205,240,137,320,172);ctx.stroke();
ctx.strokeStyle='#fffdf3';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(135,50);ctx.bezierCurveTo(95,160,215,280,152,440);ctx.stroke();ctx.beginPath();ctx.moveTo(-8,315);ctx.bezierCurveTo(90,275,220,370,330,320);ctx.stroke();
ctx.strokeStyle='#d9cba9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(135,50);ctx.bezierCurveTo(95,160,215,280,152,440);ctx.stroke();ctx.beginPath();ctx.moveTo(-8,315);ctx.bezierCurveTo(90,275,220,370,330,320);ctx.stroke();
ctx.fillStyle='#62746e';ctx.font='9px sans-serif';ctx.fillText('PARK',38,125);ctx.fillText('GREENWAY',216,145);ctx.fillText('RIVER RD',42,193);ctx.fillText('NORTH AVE',201,331);ctx.fillText('LOCAL ST',223,268);
// Top status and coordinates
ctx.fillStyle='#101a20ef';ctx.fillRect(0,0,w,55);ctx.fillStyle='#5ed9d0';ctx.font='bold 13px monospace';ctx.fillText('GEOpath',9,18);ctx.fillStyle='#f1f6f6';ctx.fillText('OFFLINE MAP',9,36);ctx.fillStyle='#c1d0d5';ctx.font='9px monospace';ctx.fillText(`${lat.toFixed(5)}, ${lon.toFixed(5)} Z${zoom}`,9,49);
// North compass in top right; map itself remains north-up.
ctx.strokeStyle='#f5ffff';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(286,24,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText('N',283,8);if(states.imu){const a=(head-90)*Math.PI/180;ctx.strokeStyle='#5ed9d0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(286,24);ctx.lineTo(286+8*Math.cos(a),24+8*Math.sin(a));ctx.stroke();}
// Current GPS location marker stays centered as the map scrolls.
ctx.fillStyle='#fb574c';ctx.beginPath();ctx.arc(160,254,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(160,254,10,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(160,237);ctx.lineTo(160,245);ctx.moveTo(160,263);ctx.lineTo(160,271);ctx.moveTo(143,254);ctx.lineTo(151,254);ctx.moveTo(169,254);ctx.lineTo(177,254);ctx.stroke();
ctx.fillStyle='#101a20ed';ctx.fillRect(0,454,w,26);ctx.fillStyle='#3c5560';ctx.fillRect(0,454,w,1);ctx.font='9px monospace';let x=7;for(const [key,label,step] of [['sd','SD',40],['tiles','MAP',53],['gps','GPS',48],['imu',states.imu?'HDG '+head+'°':'HDG --',80]]){ctx.fillStyle=states[key]?'#a2ec78':'#ff7c73';ctx.fillText(states[key]?label:label+' --',x,470);x+=step;}
document.querySelector('#latv').value=lat.toFixed(5);document.querySelector('#lonv').value=lon.toFixed(5);document.querySelector('#headingv').value=head+'°';document.querySelector('#zoomv').value=zoom;}
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',draw));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{states[b.dataset.state]=!states[b.dataset.state];b.classList.toggle('on',states[b.dataset.state]);draw()});draw();
</script></body></html>
